name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # only used by the release step; pull requests from forks stay read-only

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: call build.cmd

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process .\OsakaNow.exe -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          exit $p.ExitCode

      - uses: actions/upload-artifact@v7
        with:
          name: OsakaNow
          path: OsakaNow.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME OsakaNow.exe --title "Osaka Now $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
