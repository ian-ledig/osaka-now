name: Bug report
description: Something is broken, empty or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Events tab
        - Movies tab
        - Showtimes and seats
        - Window, tray icon or startup
        - Installing
        - Other
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: System version
      description: For Linux, please include the distribution and desktop.
      placeholder: Windows 11 24H2 / macOS 15 / Ubuntu 24.04 with GNOME
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v2.0.0
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Output of --dump
      description: Optional. For an empty or wrong list, run `OsakaNow --dump > ranking.txt` and paste the first lines.
      render: text
