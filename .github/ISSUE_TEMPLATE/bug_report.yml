name: Bug report
description: Something is broken, empty or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Events tab
        - Movies tab
        - Showtimes and seats
        - Window, tray icon or startup
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: dump
    attributes:
      label: Output of --dump
      description: Optional. For an empty or wrong list, run `OsakaNow.exe --dump > ranking.txt` and paste the first lines.
      render: text
