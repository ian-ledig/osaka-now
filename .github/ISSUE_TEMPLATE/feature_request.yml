name: Feature request
description: An idea, another event source, city or cinema
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: For a new source, link the page that lists the events or showtimes.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
