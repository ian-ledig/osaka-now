version: '3'

# Run these with `wails3 task <name>`, or use the shortcuts `wails3 dev`, `wails3 build` and `wails3 package`.

vars:
  APP_NAME: "OsakaNow"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Defaults to the system you are on. Override with `wails3 build GOOS=...`.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build (installer, .app bundle, AppImage and so on)
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application with live reload
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs the Go tests
    cmds:
      - go test ./...
